# KITTI Sequence 01 전용 설정
# 카메라: KITTI Odometry 계열 P0/P2 기준 fx≈707.09 사용
# 이미지 크기: 1241x376 → --resize 1240 376 옵션과 함께 사용
# SuperPoint 구조에 맞춰 8의 배수인 1240x376 사용
# focal_multiplier = 707.09 / 1240 ≈ 0.5702

camera:
  focal_multiplier: 0.5702     # 1240x376 리사이즈 기준: 707.09/1240
  min_dimension: 64
  resize_target: 1240
  dashboard_mask_ratio: 0.95   # KITTI는 본넷이 거의 없음

superpoint:
  conf_thresh: 0.012           # 특징점 확보를 위해 08 설정보다 약간 완화
  nn_thresh: 0.7
  max_kpts: 2000
  min_kpts: 500
  roi_sky: 0.22                # KITTI 01 기준 상단 하늘 영역 일부 제외
  roi_hood: 0.94               # 본넷 마스킹 최소화
  sp_scale: 1.0
  sp_interval: 2               # 실행 명령어의 --sp-interval 2와 일관성 유지
  sp_fp16: false

clahe:
  enabled: true
  clip_limit: 2.0
  tile_grid_size: [8, 8]

matcher:
  mutual: true
  ratio_thresh: 0.80

semantic:
  enabled: false               # 명령어에서 --use_semantic 사용 시 true로 override됨
  yolo_conf: 0.35              # 애매한 객체 탐지를 줄이기 위해 0.30 → 0.35
  half: true
  dynamic_classes: [0, 1, 2, 3, 5, 7]

point_filter:
  use_shadow_filter: false     # KITTI 도로는 그림자 필터 불필요
  use_top_region_filter: false # 하늘 제거는 roi_sky로 처리
  shadow_value_thresh: 0.46
  shadow_saturation_thresh: 0.30
  min_shadow_grad: 15.0
  min_shadow_local_std: 8.0
  shadow_rel_dark_thresh: 0.82
  top_region_ratio: 0.30
  top_region_min_grad: 25.0
  top_region_min_std: 10.0

optical_flow:
  win_size: 21
  max_level: 3
  fb_thresh: 1.0
  termination_epsilon: 0.01
  termination_max_iter: 30

pnp:
  min_points: 25               # 충분한 대응점이 있을 때만 PnP 수행
  min_inliers: 18              # 정상 대응점 기준 강화
  reprojection_error: 4.0      # 기존 5.0보다 엄격하게 설정
  min_translation: 0.001
  max_translation: 15.0        # KITTI 고속 구간 허용
  ransac_iterations: 1500
  confidence: 0.995

motion:
  speed_jump_multiplier: 5.0
  min_speed_thresh: 0.3
  direction_reversal_cos: -0.5

stabilization:
  y_damping: 0.04
  pitch_roll_damping: 0.12
  inertia_weight: 0.30
  y_clip: [-2.0, 2.0]          # KITTI 오르막/내리막 허용
  dead_reckoning_decay: 0.75
  speed_history_len: 30

triangulation:
  min_depth: 0.5
  max_depth: 200.0
  max_x_extent: 150.0
  max_y_extent: 30.0

keyframe:
  parallax_threshold: 25.0
  min_gap: 3
  max_gap: 20
  adaptive_inlier_ratio: 0.4
  min_adaptive_inliers: 25
  stall_distance: 0.3
  stall_lookback: 10
  alignment_dist: 3.0
  culling_interval: 5

epipolar:
  essential_threshold: 0.5
  homography_threshold: 3.0
  homography_selection_ratio: 0.85
  homography_min_inliers: 15

ba:
  local_keyframes: 5
  local_iterations: 5
  global_iterations: 10
  min_observations: 2
  min_map_points: 10
  reprojection_weight: 0.5
  huber_delta: 5.991
  pose_drift_threshold: 3.0
  outlier_chi2_threshold: 5.991
  two_pass_rejection: true
  rotation_drift_threshold: 0.2
  adaptive_termination: false
  convergence_threshold: 0.01
  min_iterations: 3

loop_closure:
  min_frame_gap: 50
  top_k: 5
  min_inliers: 35
  min_inlier_ratio: 0.25
  descriptor_similarity: 0.98
  verify_min_inliers: 35
  verify_min_inlier_ratio: 0.25
  verify_min_3d_points: 20
  verify_reprojection_error: 4.0

pose_graph:
  rotation_weight: 10.0
  translation_weight: 1.0
  iterations: 20

map_culling:
  min_observations: 3

viz:
  enabled: true
  window_size: [1240, 376]
  keypoint_radius: 2
  voxel_size: 0.1
  point_size: 3.0

performance:
  filter_on_sp_only: false
  local_map_limit: 0
  local_map_keyframes: 5
  local_map_projection_dist: 10.0

logging:
  csv_per_frame: false
  csv_path: "frame_log.csv"