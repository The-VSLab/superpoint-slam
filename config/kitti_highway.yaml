# KITTI 고속도로 주행 설정 (시퀀스 01 등: ~80km/h, 직선, 저텍스처)
# - kitti_urban.yaml과의 차이: roi_sky 0.20(지평선 낮음), speed_jump 8.0(고속 가감속),
#   parallax_threshold 40(시차 빨리 쌓임), loop min_frame_gap 50(단편 시퀀스)
# - intrinsics는 시퀀스별 calib.txt를 --calib로 넘기는 것을 권장 (--resize 1226 370)
# - 참고: 01은 재방문이 없어 루프 클로저가 발화하지 않는 것이 정상

camera:
  focal_multiplier: 0.5693     # --calib 미지정 시 폴백 (kitti_urban과 동일 카메라 그룹)
  min_dimension: 64
  resize_target: 640
  dashboard_mask_ratio: 0.95

superpoint:
  conf_thresh: 0.015
  nn_thresh: 0.7
  max_kpts: 1500
  min_kpts: 400
  roi_sky: 0.20                # 고속도로는 지평선이 낮아 하늘 비율이 더 큼
  roi_hood: 0.92
  sp_scale: 1.0
  sp_interval: 1
  sp_fp16: false

clahe:
  enabled: true
  clip_limit: 2.0
  tile_grid_size: [8, 8]

matcher:
  mutual: true
  ratio_thresh: 0.80

semantic:
  enabled: false
  yolo_conf: 0.3
  half: true
  dynamic_classes: [0, 1, 2, 3, 5, 7]

point_filter:
  use_shadow_filter: false
  use_top_region_filter: false
  shadow_value_thresh: 0.46
  shadow_saturation_thresh: 0.30
  min_shadow_grad: 15.0
  min_shadow_local_std: 8.0
  shadow_rel_dark_thresh: 0.82
  top_region_ratio: 0.30
  top_region_min_grad: 25.0
  top_region_min_std: 10.0

optical_flow:
  win_size: 21
  max_level: 3
  fb_thresh: 1.0
  termination_epsilon: 0.01
  termination_max_iter: 30

pnp:
  min_points: 15
  min_inliers: 10
  reprojection_error: 5.0
  min_translation: 0.001
  max_translation: 15.0
  ransac_iterations: 1000
  confidence: 0.99

motion:
  speed_jump_multiplier: 8.0   # 고속 주행 시 가속/감속 편차 허용
  min_speed_thresh: 0.3
  direction_reversal_cos: -0.5

stabilization:
  y_damping: 0.05
  pitch_roll_damping: 0.15
  inertia_weight: 0.4
  y_clip: [-2.0, 2.0]
  dead_reckoning_decay: 0.8
  speed_history_len: 30

triangulation:
  min_depth: 0.5
  max_depth: 200.0
  max_x_extent: 150.0
  max_y_extent: 30.0

keyframe:
  parallax_threshold: 40.0     # 고속 주행 시 parallax가 빨리 쌓임
  min_gap: 8
  max_gap: 40
  adaptive_inlier_ratio: 0.4
  min_adaptive_inliers: 25
  stall_distance: 0.3
  stall_lookback: 10
  alignment_dist: 3.0
  culling_interval: 5

epipolar:
  essential_threshold: 0.5
  homography_threshold: 3.0
  homography_selection_ratio: 0.85
  homography_min_inliers: 15

ba:
  local_keyframes: 5
  local_iterations: 5
  global_iterations: 10
  min_observations: 2
  min_map_points: 10
  reprojection_weight: 0.5
  huber_delta: 5.991
  pose_drift_threshold: 3.0
  outlier_chi2_threshold: 5.991
  two_pass_rejection: true
  rotation_drift_threshold: 0.2
  adaptive_termination: false
  convergence_threshold: 0.01
  min_iterations: 3

loop_closure:
  min_frame_gap: 50            # raw 프레임 기준 (1101프레임 단편 시퀀스용)
  top_k: 5                     # kitti_urban과 동일 (검증 후보 수)
  min_inliers: 20
  min_inlier_ratio: 0.15
  descriptor_similarity: 0.80    # kitti_urban과 동일 (centered mean-pool 기준)
  check_interval: 3
  min_distinctiveness: 1.02
  verify_min_inliers: 25         # 07 실측 검증값 동기화 — 01은 루프가 없어 오탐 방지가 특히 중요
  verify_min_inlier_ratio: 0.30  # (구 값 12/0.10은 디스크립터 붕괴 시절 튜닝 → 가짜 루프 위험)
  verify_min_3d_points: 15
  verify_reprojection_error: 8.0

pose_graph:
  rotation_weight: 10.0
  translation_weight: 1.0
  iterations: 20

map_culling:
  min_observations: 3

viz:
  enabled: true
  window_size: [640, 360]
  keypoint_radius: 2
  voxel_size: 0.1
  point_size: 3.0

performance:
  filter_on_sp_only: false
  local_map_limit: 0
  local_map_keyframes: 5
  local_map_projection_dist: 10.0

logging:
  csv_per_frame: false
  csv_path: "frame_log.csv"
