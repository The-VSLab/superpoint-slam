# KITTI 도심 주행 공통 설정 (시퀀스 00/02/05/06/07/08/09/10)
# - 검증: 07 (PnP 루프 검출, ATE 14.4m), 08 (가짜 루프 0건, ATE 48.2m)
# - intrinsics는 시퀀스별 calib.txt를 --calib로 넘기는 것을 권장
#   (04~12: 1226x370 → --resize 1226 370 / 00~02: 1241x376, fx가 다름!)
# - 고속도로(01 등)는 kitti_highway.yaml 사용

camera:
  focal_multiplier: 0.5693     # --calib 미지정 시 폴백 (04~12 그룹 fx=707.09 기준)
  min_dimension: 64
  resize_target: 640
  dashboard_mask_ratio: 0.95   # KITTI는 본넷이 거의 없음

superpoint:
  conf_thresh: 0.015
  nn_thresh: 0.7
  max_kpts: 1500
  min_kpts: 400
  roi_sky: 0.25               # KITTI 08은 하늘 비율이 적음
  roi_hood: 0.92              # 본넷 마스킹 최소화
  sp_scale: 1.0
  sp_interval: 1
  sp_fp16: false

clahe:
  enabled: true
  clip_limit: 2.0
  tile_grid_size: [8, 8]

matcher:
  mutual: true
  ratio_thresh: 0.80

semantic:
  enabled: false
  yolo_conf: 0.3
  half: true
  dynamic_classes: [0, 1, 2, 3, 5, 7]

point_filter:
  use_shadow_filter: false     # KITTI 도로는 그림자 필터 불필요
  use_top_region_filter: false # 하늘 제거는 roi_sky로 처리
  shadow_value_thresh: 0.46
  shadow_saturation_thresh: 0.30
  min_shadow_grad: 15.0
  min_shadow_local_std: 8.0
  shadow_rel_dark_thresh: 0.82
  top_region_ratio: 0.30
  top_region_min_grad: 25.0
  top_region_min_std: 10.0

optical_flow:
  win_size: 21
  max_level: 3
  fb_thresh: 1.0
  termination_epsilon: 0.01
  termination_max_iter: 30

pnp:
  min_points: 15
  min_inliers: 10
  reprojection_error: 5.0
  min_translation: 0.001
  max_translation: 15.0       # KITTI 고속 구간 허용
  ransac_iterations: 1000
  confidence: 0.99

motion:
  speed_jump_multiplier: 6.0
  min_speed_thresh: 0.3
  direction_reversal_cos: -0.5

stabilization:
  # A/B 검증(KITTI 08): 댐핑 ON이 ATE 48.2 vs OFF 51.7 — 언덕 구간에서 댐핑이 유리.
  # (루프 클로저 PnP는 댐핑과 무관 — 클린 3D 소스(_lc_pts3d_sp)가 열쇠였음)
  y_damping: 0.05
  pitch_roll_damping: 0.15
  inertia_weight: 0.4
  y_clip: [-2.0, 2.0]         # KITTI 오르막/내리막 허용
  dead_reckoning_decay: 0.8
  speed_history_len: 30

triangulation:
  min_depth: 0.5
  max_depth: 200.0
  max_x_extent: 150.0
  max_y_extent: 30.0

keyframe:
  parallax_threshold: 60.0    # 1224px 해상도 기준, 640px 대비 2배 보정 (25→60)
  min_gap: 8                  # 11fps 기준 최소 0.7초 간격 보장
  max_gap: 40                 # 최대 강제 키프레임 간격
  adaptive_inlier_ratio: 0.4
  min_adaptive_inliers: 25
  stall_distance: 0.3
  stall_lookback: 10
  alignment_dist: 3.0
  culling_interval: 5

epipolar:
  essential_threshold: 0.5
  homography_threshold: 3.0
  homography_selection_ratio: 0.85
  homography_min_inliers: 15

ba:
  local_keyframes: 5
  local_iterations: 5
  global_iterations: 10
  min_observations: 2
  min_map_points: 10
  reprojection_weight: 0.5
  huber_delta: 5.991
  pose_drift_threshold: 3.0
  outlier_chi2_threshold: 5.991
  two_pass_rejection: true
  rotation_drift_threshold: 0.2
  adaptive_termination: false
  convergence_threshold: 0.01
  min_iterations: 3

loop_closure:
  min_frame_gap: 200          # 키프레임 기준 최소 간격 (약 200 keyframe 이후 후보)
  top_k: 5                    # 검증 후보 수 (2는 진짜 재방문 쌍이 검증 기회를 놓침, RANSAC 비용 미미)
  min_inliers: 20
  min_inlier_ratio: 0.15
  descriptor_similarity: 0.80 # 0.60은 전체 통과(오탐), max_sim=1.0 진짜 루프는 0.80에서도 감지
  check_interval: 3           # 3 키프레임마다 1번만 루프 클로저 검색 수행
  min_distinctiveness: 1.02   # top1/top2 비율: 2% 이상 차이 없으면 스킵 (1.04는 너무 공격적)
  verify_min_inliers: 25      # KITTI 07 실측: 진짜 루프 32, 가짜 12~13 → 25로 분리
  verify_min_inlier_ratio: 0.30  # 진짜 0.52 vs 가짜 0.33 — inliers가 주 분리자, ratio는 보조
  verify_min_3d_points: 15
  verify_reprojection_error: 8.0

pose_graph:
  rotation_weight: 10.0
  translation_weight: 1.0
  iterations: 20

map_culling:
  min_observations: 3

viz:
  enabled: true
  window_size: [640, 360]
  keypoint_radius: 2
  voxel_size: 0.1
  point_size: 3.0

performance:
  filter_on_sp_only: false
  local_map_limit: 0
  local_map_keyframes: 5
  local_map_projection_dist: 10.0

logging:
  csv_per_frame: false
  csv_path: "frame_log.csv"
