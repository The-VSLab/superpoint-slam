# [데이터 및 경로]
data_dir: dataset/coco2017/train2017
val_dir: dataset/coco2017/val2017
output_dir: checkpoints
height: 480
width: 640

# [학습 하이퍼파라미터]
epochs: 20
batch_size: 4
val_batch_size: 8
lr: 1.0e-4
num_workers: 8
fp16: true
val_interval: 2
use_teacher_desc: false
debug_every: 100
top_k: 1200
save_every_steps: 2000
resume: true
resume_from: checkpoints/v14_resume.pt

# [손실 가중치]
det_weight: 1.0
desc_weight: 2.0
sup_weight: 25.0
dustbin_weight: 0.05

# [누락된 데이터 증강 파라미터 - 반드시 추가]
max_rotate: 15.0       # 최대 회전 각도
max_scale: 0.1        # 최대 확대/축소 비율
max_perspective: 0.05  # 최대 원근 변형 강도